<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Junior — RCGC 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>

/* ════════════════ RESET & VARIABLES ════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gd:#1a3a2a;--gm:#2d5a3d;--gl:#4a8c5c;
  --gold:#c9a84c;--gold-l:#e8d08a;
  --cream:#f8f5ee;--cream-d:#ede9df;
  --td:#1a1a1a;--tm:#4a4a4a;--tl:#888;
  --white:#fff;--red:#c0392b;--red-l:#fdf0ef;
  --sh-sm:0 1px 4px rgba(0,0,0,.08);
  --sh-md:0 4px 16px rgba(0,0,0,.12);
  --sh-lg:0 8px 32px rgba(0,0,0,.18);
  --r:10px;--rs:6px
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--td);min-height:100vh;font-size:15px}

/* ════════════════ LOGIN ════════════════ */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--gd);
  background-image:radial-gradient(ellipse at 20% 50%,rgba(74,140,92,.3) 0%,transparent 60%),
                   radial-gradient(ellipse at 80% 20%,rgba(201,168,76,.15) 0%,transparent 50%)}
.login-card{background:var(--white);border-radius:20px;padding:2.5rem 2.5rem;text-align:center;
  width:420px;max-width:94vw;box-shadow:var(--sh-lg)}
.login-banner-img{width:100%;max-width:340px;object-fit:contain;margin-bottom:16px}
.login-logo-img{width:100px;height:100px;border-radius:50%;object-fit:cover;margin-bottom:20px;box-shadow:var(--sh-md)}
.club-logo{font-size:52px;margin-bottom:1rem;display:block}
.login-card h1{font-family:'Playfair Display',serif;font-size:30px;color:var(--gd);margin-bottom:4px}
.club-sub{color:var(--tl);font-size:13px;letter-spacing:.04em;margin-bottom:2rem}
.login-opts{display:flex;flex-direction:column;gap:10px;margin-bottom:1rem}
.btn-pub{padding:12px 20px;border:2px solid var(--gm);border-radius:var(--r);background:transparent;
  color:var(--gm);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-pub:hover{background:var(--gm);color:var(--white)}
.btn-adm{padding:12px 20px;border:none;border-radius:var(--r);background:var(--gd);color:var(--white);
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s}
.btn-adm:hover{background:var(--gm)}
.pw-input{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:var(--r);font-size:15px;
  margin-bottom:10px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}
.pw-input:focus{border-color:var(--gm)}
#login-err{color:var(--red);font-size:13px;margin-top:6px;display:none}

/* ════════════════ HEADER ════════════════ */
.app-header{background:var(--gd);color:var(--white);box-shadow:var(--sh-md);position:sticky;top:0;z-index:100}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;min-height:80px}
  padding:14px 20px;max-width:960px;margin:0 auto}
.hdr-brand{display:flex;align-items:center;gap:12px}
.hdr-logo{font-size:24px}
.hdr-logo-img{height:72px;width:72px;border-radius:50%;object-fit:cover;flex-shrink:0;margin-left:12px}
.hdr-title-img{height:64px;object-fit:contain;max-width:420px}
@media(max-width:480px){.hdr-title-img{max-width:200px;height:44px}.hdr-logo-img{height:52px;width:52px}}
.hdr-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;line-height:1.2}
.hdr-sub{font-size:12px;opacity:.65}
.hdr-right{display:flex;align-items:center;gap:10px}
.mode-badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500}
.mode-badge.adm{background:var(--gold);color:var(--gd)}
.mode-badge.pub{background:rgba(255,255,255,.15);color:var(--white)}
.btn-exit{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:var(--white);
  padding:5px 12px;border-radius:var(--rs);font-size:13px;cursor:pointer;
  font-family:'DM Sans',sans-serif;transition:background .2s}
.btn-exit:hover{background:rgba(255,255,255,.22)}
.app-nav{display:flex;gap:2px;padding:0 20px;max-width:960px;margin:0 auto;
  overflow-x:auto;scrollbar-width:none}
.app-nav::-webkit-scrollbar{display:none}
.nav-btn{padding:10px 16px;background:transparent;border:none;border-bottom:2px solid transparent;
  color:rgba(255,255,255,.6);font-family:'DM Sans',sans-serif;font-size:13px;
  cursor:pointer;white-space:nowrap;transition:all .2s}
.nav-btn:hover{color:var(--white)}
.nav-btn.active{color:var(--gold-l);border-bottom-color:var(--gold);font-weight:500}

/* ════════════════ MAIN ════════════════ */
.app-main{max-width:960px;margin:0 auto;padding:24px 16px 80px}
.tab-content{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* ════════════════ CARDS ════════════════ */
.card{background:var(--white);border-radius:var(--r);padding:20px;margin-bottom:16px;
  box-shadow:var(--sh-sm);border:1px solid rgba(0,0,0,.06)}
.card h2{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;
  color:var(--gd);margin-bottom:16px}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sec-hdr h2{margin-bottom:0}

/* ════════════════ FORMS ════════════════ */
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fr.full{grid-template-columns:1fr}
.fr.three{grid-template-columns:1fr 1fr 1fr}
@media(max-width:520px){.fr,.fr.three{grid-template-columns:1fr}}
.fg label{display:block;font-size:11px;font-weight:500;color:var(--tl);
  margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=date],input[type=number],select{
  width:100%;padding:10px 12px;border:1.5px solid #e0ddd6;border-radius:var(--rs);
  font-size:14px;font-family:'DM Sans',sans-serif;color:var(--td);background:var(--white);
  transition:border-color .2s;outline:none}
input:focus,select:focus{border-color:var(--gm)}
input[readonly]{background:var(--cream);color:var(--tm);cursor:default}
.hcp-note{font-size:12px;color:var(--tl);margin-top:4px;font-style:italic}

/* ════════════════ HOLES GRID ════════════════ */
.holes-grid{display:grid;gap:8px;margin-bottom:16px}
.hg5{grid-template-columns:repeat(5,1fr)}
.hole-par{display:block;font-size:9px;font-weight:600;color:var(--gd);text-align:center;margin-top:1px}
.hole-yds{display:block;font-size:9px;color:var(--tl);text-align:center;margin-bottom:2px}
.hg9,.hg18{grid-template-columns:repeat(9,1fr)}
@media(max-width:520px){.hg9,.hg18{grid-template-columns:repeat(5,1fr)}}
.hole-group-lbl{grid-column:1/-1;font-size:11px;font-weight:500;color:var(--tl);
  text-transform:uppercase;letter-spacing:.06em;padding:6px 0 3px;
  border-bottom:1px solid var(--cream-d);margin-top:6px}
.hole-inp label{display:block;font-size:10px;font-weight:500;color:var(--tl);
  margin-bottom:4px;text-align:center}
.hole-inp input{text-align:center;padding:8px 2px;font-size:16px;font-weight:500}

/* ════════════════ TOTALS ════════════════ */
.totals-bar{display:grid;gap:10px;margin-top:16px}
.tb3{grid-template-columns:repeat(3,1fr)}
.tb5{grid-template-columns:repeat(5,1fr)}
@media(max-width:480px){.tb5{grid-template-columns:repeat(3,1fr)}}
.tot-card{background:var(--cream);border-radius:var(--rs);padding:12px 8px;
  text-align:center;border:1px solid var(--cream-d)}
.tot-card .lbl{font-size:10px;font-weight:500;color:var(--tl);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.tot-card .val{font-size:22px;font-weight:500;color:var(--gd)}

/* ════════════════ BUTTONS ════════════════ */
.btn{padding:10px 20px;border:1.5px solid #ddd;border-radius:var(--r);
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;
  background:var(--white);color:var(--tm);transition:all .18s}
.btn:hover{border-color:#aaa;color:var(--td)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--gd);color:var(--white);border-color:var(--gd)}
.btn-primary:hover{background:var(--gm);border-color:var(--gm);color:var(--white)}
.btn-gold{background:var(--gold);color:var(--gd);border-color:var(--gold);font-weight:600}
.btn-gold:hover{background:var(--gold-l);border-color:var(--gold-l)}
.btn-danger{background:var(--red-l);color:var(--red);border-color:#f5c6c2}
.btn-danger:hover{background:#f9dedd}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:var(--rs)}
.btn-row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}

/* ════════════════ TABLES / LEADERBOARD ════════════════ */
.lb-wrap{background:var(--white);border-radius:var(--r);box-shadow:var(--sh-sm);
  border:1px solid rgba(0,0,0,.06);margin-bottom:20px;overflow:hidden}
.lb-cat-hdr{display:flex;align-items:center;gap:10px;padding:14px 20px 12px;
  border-bottom:1px solid var(--cream-d);background:var(--cream);border-radius:var(--r) var(--r) 0 0}
.lb-cat-icon{font-size:20px}
.lb-cat-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--gd)}
.lb-cat-years{font-size:12px;color:var(--tl);margin-left:auto}
table.lb{width:100%;border-collapse:collapse;font-size:14px}
table.lb th{font-size:11px;font-weight:500;color:var(--tl);text-transform:uppercase;
  letter-spacing:.04em;padding:8px 12px;text-align:left;border-bottom:1px solid var(--cream-d)}
table.lb td{padding:11px 12px;border-bottom:1px solid #f5f3ee;vertical-align:middle}
table.lb tr:last-child td{border-bottom:none}
table.lb tr:hover td{background:#fafaf8}
.rank{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  border-radius:50%;font-size:13px;font-weight:600}
.r1{background:var(--gold);color:var(--gd)}
.r2{background:#e0ddd8;color:#444}
.r3{background:#f5d5c0;color:#7a3b1e}
.rn{background:var(--cream);color:var(--tl);font-size:12px}
.pname{font-weight:500}
.cat-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.cM18{background:#ede9fb;color:#3d2f8a}
.cALBATROS{background:#e3f0fb;color:#174f8a}
.cAGUILA{background:#e4f7ec;color:#1a5e38}
.cBIRDIE{background:#fef5e3;color:#7a5010}
.cPAR{background:#fdeee9;color:#7a2e1a}
.cINICIALES{background:#f0efec;color:#555}
.neto-v{font-weight:600;color:var(--gd)}
.gross-badge{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:10px;
  font-size:10px;font-weight:600;background:var(--cream);color:var(--gd);
  border:1px solid var(--bd);vertical-align:middle}
table.lb tr.already-gross td{opacity:.6}
table.lb tr.already-gross:hover td{opacity:.85}
table.lb tr.prize-gross-1 td{background:#daf0fb}
table.lb tr.prize-gross-2 td{background:#daf0fb}
table.lb tr.prize-gross-3 td{background:#daf0fb}
table.lb tr.prize-neto-1 td{background:#fde8d0}
table.lb tr.prize-neto-2 td{background:#fde8d0}
table.lb tr.prize-neto-3 td{background:#fde8d0}
.empty-st{text-align:center;padding:40px 20px;color:var(--tl);font-size:14px}
.empty-icon{font-size:36px;margin-bottom:12px;display:block}

/* ════════════════ CAT FILTERS ════════════════ */
.cat-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.cfbtn{padding:6px 14px;border:1.5px solid var(--cream-d);border-radius:20px;
  font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;
  background:var(--white);color:var(--tm);transition:all .18s}
.cfbtn:hover{border-color:var(--gm);color:var(--gm)}
.cfbtn.active{background:var(--gd);border-color:var(--gd);color:var(--white)}

/* ════════════════ BANNERS ════════════════ */
.part-banner{background:#fffbf0;border:1px solid #f0d88a;border-radius:var(--rs);
  padding:12px 16px;font-size:13px;color:#7a5a10;margin-bottom:16px}
.info-banner{background:#e8f4fd;border:1px solid #a8d4f0;border-radius:var(--rs);
  padding:12px 16px;font-size:13px;color:#1a4a70;margin-bottom:16px;display:flex;
  align-items:flex-start;gap:8px}

/* ════════════════ SEARCH ════════════════ */
.search-inp{width:100%;padding:10px 14px;border:1.5px solid #e0ddd6;border-radius:var(--r);
  font-size:14px;font-family:'DM Sans',sans-serif;margin-bottom:16px;outline:none;
  background:var(--cream);transition:border-color .2s,background .2s}
.search-inp:focus{border-color:var(--gm);background:var(--white)}

/* ════════════════ MODAL ════════════════ */
.modal-ov{position:fixed;inset:0;background:rgba(20,40,30,.55);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:500}
.modal-box{background:var(--white);border-radius:16px;padding:28px 24px;
  width:420px;max-width:95vw;box-shadow:var(--sh-lg)}
.modal-box-wide{width:760px;max-height:85vh;overflow:auto}
.imp-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.imp-table th,.imp-table td{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:left}
.imp-ok{color:#1a7a3a}
.imp-skip{color:var(--tl)}
.imp-summary{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}
.imp-summary div{background:var(--bg2);border-radius:8px;padding:8px 14px;font-size:13px}
.imp-summary b{font-family:'Playfair Display',serif;font-size:18px;color:var(--gd);display:block}
.imp-table h4{margin:14px 0 4px;font-family:'Playfair Display',serif;color:var(--gd)}
.imp-table tr.amb td{background:#fff6e0}
.imp-warn{color:#a87a00;font-size:11px}
.imp-table select{font-size:12px;padding:2px 4px}
.imp-table .gen-warn{background:#fff6e0}
.imp-dup-row{font-size:13px;color:var(--tl);padding:4px 0;border-bottom:1px solid var(--bd)}
.modal-box h3{font-family:'Playfair Display',serif;font-size:20px;color:var(--gd);margin-bottom:20px}
.modal-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* ════════════════ TOAST ════════════════ */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:var(--r);
  font-size:14px;font-weight:500;z-index:999;display:none;box-shadow:var(--sh-md);max-width:300px}
.toast.ok{background:var(--gd);color:var(--white)}
.toast.err{background:var(--red);color:var(--white)}

/* ════════════════ EXPORT ════════════════ */
.export-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.lb-layout{display:grid;grid-template-columns:1fr 220px;gap:24px;align-items:start}
.lb-banner{position:sticky;top:80px}
.lb-banner img{width:100%;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
@media(max-width:700px){.lb-layout{grid-template-columns:1fr}.lb-banner{display:none}}

/* ════════════════ CHIPS ════════════════ */
.score-chips{display:flex;gap:4px;flex-wrap:wrap}
.score-chip{font-size:11px;background:var(--cream);border-radius:4px;padding:2px 6px;color:var(--tm)}

@media(max-width:600px){
  
  .app-main{padding:16px 12px 70px}
  .card{padding:14px}
  table.lb th,table.lb td{padding:9px 8px;font-size:13px}
}
  



.sync-indicator{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.7)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#2ecc71;animation:pulse 2s infinite}
.sync-dot.offline{background:#e74c3c;animation:none}
.loading-screen{position:fixed;inset:0;background:var(--gd);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
.loading-screen p{color:rgba(255,255,255,.8);font-size:14px}
.spinner-lg{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
/* Subcategoría género en leaderboard */
.gen-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--tm);background:var(--cream);padding:2px 9px;border-radius:20px;margin-left:auto}
.lb-subhdr{display:flex;align-items:center;gap:8px;padding:10px 20px 8px;background:#fafaf7;border-bottom:1px solid var(--cream-d);font-size:13px;font-weight:600;color:var(--gd)}
.lb-subhdr .score-type{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:4px}
.lb-subhdr .score-type.gross{background:#e8eef0;color:#33566a}
.lb-subhdr .score-type.neto{background:var(--gold-l);color:var(--gd)}
.lb-block{margin-bottom:14px}
.gen-pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.gen-M{background:#e3f0fb;color:#174f8a}.gen-F{background:#fdeaf2;color:#a02063}
.clickable{cursor:pointer;transition:background .15s}
.clickable:hover{background:#f0ede4 !important}
/* Filtros historial */
.hist-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.hist-filters .fg label{font-size:11px}
.hist-filters select,.hist-filters input{padding:8px 10px;font-size:13px}
.filter-clear{display:flex;align-items:flex-end}
/* Tarjeta del día (scorecard modal) */
.scorecard{max-width:560px}
.sc-head{text-align:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--cream-d)}
.sc-name{font-family:'Playfair Display',serif;font-size:20px;color:var(--gd);font-weight:600}
.sc-meta{font-size:13px;color:var(--tl);margin-top:4px}
.sc-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-bottom:6px;font-size:12px}
.sc-grid.g18{grid-template-columns:repeat(10,1fr)}
.sc-cell{text-align:center;padding:6px 2px;border-radius:4px;background:var(--cream)}
.sc-cell.hd{background:var(--gd);color:#fff;font-weight:600;font-size:10px}
.sc-cell.tot{background:var(--gold);color:var(--gd);font-weight:700}
.sc-cell .hn{font-size:9px;color:var(--tl);display:block}
.sc-cell.hd .hn{color:rgba(255,255,255,.7)}
.sc-cell.par-lbl{background:#d6ecd6;color:#2a5c2a;font-weight:600;font-size:10px}
.sc-cell.par-val{background:#edf7ed;color:#2a5c2a;font-size:12px}
.sc-cell.yds-lbl{background:#e3eaf5;color:#2a4a7a;font-weight:600;font-size:10px}
.sc-cell.yds-val{background:#f0f4fb;color:#2a4a7a;font-size:11px}
.sc-cell.sc-eagle{background:#ffd700;color:#7a5000;font-weight:700}
.sc-cell.sc-birdie{background:#b8e6b8;color:#1a5c1a;font-weight:600}
.sc-cell.sc-par{background:var(--cream)}
.sc-cell.sc-bogey{background:#fde8e8;color:#8b0000}
.sc-cell.sc-dbogey{background:#f5c0c0;color:#8b0000;font-weight:600}
.sc-totals{display:flex;justify-content:center;gap:24px;margin-top:16px;padding-top:14px;border-top:1px solid var(--cream-d)}
.sc-tot-item{text-align:center}
.sc-tot-item .l{font-size:11px;color:var(--tl);text-transform:uppercase;letter-spacing:.04em}
.sc-tot-item .v{font-size:26px;font-weight:600;color:var(--gd)}
/* Estadísticas */
.stats-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:var(--r);padding:16px;box-shadow:var(--sh-sm);border:1px solid rgba(0,0,0,.06);text-align:center}
.stat-card .sv{font-size:28px;font-weight:600;color:var(--gd);line-height:1}
.stat-card .sl{font-size:11px;color:var(--tl);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}

.hole-bar-val{font-size:10px;color:var(--gd);font-weight:600}
.hole-bar-lbl{font-size:9px;color:var(--tl)}
.stats-empty{text-align:center;padding:30px;color:var(--tl);font-size:14px}

function scoreGenero(s){
  if(s.genero==="M"||s.genero==="F")return s.genero;
  const p=players.find(x=>x.id===s.jid);
  return p&&p.genero==="F"?"F":"M";
}

function catFromYear(y){
  y=parseInt(y);
  if(y>=2008&&y<=2012)return"M18";
  if(y>=2013&&y<=2014)return"ALBATROS";
  if(y>=2015&&y<=2016)return"AGUILA";
  if(y>=2017&&y<=2018)return"BIRDIE";
  if(y>=2019&&y<=2020)return"PAR";
  if(y>=2021)return"INICIALES";
  return null;
}

let isAdmin=false,players=[],scores=[],activeLbCat="TODAS",activeLbTorneo="TODOS";
let isIniciales=false,isM18=false,catHoles=9,catVuelta=false,editingId=null,currentTab="leaderboard";
let unsubPlayers=null,unsubScores=null;

function setOnline(on){
  document.getElementById("sync-dot").className="sync-dot"+(on?"":" offline");
  document.getElementById("sync-text").textContent=on?"En línea":"Sin conexión";
}
window.addEventListener("online",()=>setOnline(true));
window.addEventListener("offline",()=>setOnline(false));

window.enterPublic=()=>{isAdmin=false;launchApp();};
window.toggleAdminForm=()=>{
  const f=document.getElementById("adm-form");
  f.style.display=f.style.display==="none"?"block":"none";
  if(f.style.display==="block")document.getElementById("pw").focus();
};
window.doLogin=()=>{
  if(document.getElementById("pw").value===ADMIN_PASSWORD){isAdmin=true;launchApp();}
  else{document.getElementById("login-err").style.display="block";document.getElementById("pw").value="";}
};
window.exitApp=()=>{
  if(unsubPlayers)unsubPlayers();
  if(unsubScores)unsubScores();
  document.getElementById("app").style.display="none";
  document.getElementById("login-screen").style.display="flex";
  document.getElementById("adm-form").style.display="none";
  document.getElementById("pw").value="";
  document.getElementById("login-err").style.display="none";
  isAdmin=false;
};

function launchApp(){
  document.getElementById("login-screen").style.display="none";
  document.getElementById("app").style.display="block";
  const b=document.getElementById("mode-badge");
  b.textContent=isAdmin?"⚙ Administrador":"👁 Solo lectura";
  b.className="mode-badge "+(isAdmin?"adm":"pub");
  buildNav();
  subscribeData();
  showTab("leaderboard");
}

function subscribeData(){
  unsubPlayers=onSnapshot(collection(db,"players"),snap=>{
    players=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(currentTab==="jugadores"||currentTab==="cargar")renderCurrentTab();
  },e=>{console.error(e);setOnline(false);});
  const q=query(collection(db,"scores"),orderBy("createdAt","desc"));
  unsubScores=onSnapshot(q,snap=>{
    scores=snap.docs.map(d=>({id:d.id,...d.data()}));
    setOnline(true);renderCurrentTab();
  },e=>{console.error(e);setOnline(false);});
}

const PUB_TABS=[{id:"leaderboard",label:"Leaderboard"},{id:"historial",label:"Historial"},{id:"estadisticas",label:"Estadísticas"},{id:"sponsors",label:"Sponsors"}];
const ADM_TABS=[{id:"leaderboard",label:"Leaderboard"},{id:"cargar",label:"Cargar Score"},{id:"historial",label:"Historial"},{id:"estadisticas",label:"Estadísticas"},{id:"jugadores",label:"Jugadores"},{id:"backup",label:"Respaldo"},{id:"sponsors",label:"Sponsors"}];

function buildNav(){
  const tabs=isAdmin?ADM_TABS:PUB_TABS;
  document.getElementById("app-nav").innerHTML=tabs.map(t=>
    `<button class="nav-btn" data-tab="${t.id}" onclick="showTab('${t.id}')">${t.label}</button>`
  ).join("");
}

window.showTab=id=>{
  currentTab=id;
  document.querySelectorAll(".tab-content").forEach(e=>e.style.display="none");
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===id));
  document.getElementById("tab-"+id).style.display="block";
  renderCurrentTab();
};
function renderCurrentTab(){
  const r={leaderboard:renderLeaderboard,cargar:renderCargar,historial:renderHistorial,
           estadisticas:renderEstadisticas,jugadores:renderJugadores,backup:renderBackup,sponsors:renderSponsors};
  if(r[currentTab])r[currentTab]();
}

// Genera una tabla de ranking para un conjunto de scores, ordenada por gross o neto
function lbTable(cs, tipo, grossWinnersJids=null){
  // mejor score por jugador según el tipo (para sort/display)
  const best={};
  cs.forEach(s=>{
    const val=tipo==="gross"?s.gross:s.neto;
    const cur=best[s.jid]?(tipo==="gross"?best[s.jid].gross:best[s.jid].neto):Infinity;
    if(val<cur)best[s.jid]=s;
  });
  const sorted=Object.values(best).sort((a,b)=>(tipo==="gross"?a.gross-b.gross:a.neto-b.neto));

  // Para Neto: determinar quiénes ya fueron premiados en Gross
  let topGrossJids=new Set();
  if(tipo==="neto"){
    if(grossWinnersJids){
      // Viene pre-calculado (caso isNetoMixed: top-3 por género)
      topGrossJids=grossWinnersJids;
    }else{
      // Caso mixto puro: top-3 gross del mismo pool
      const bestG={};
      cs.forEach(s=>{
        const cur=bestG[s.jid]?bestG[s.jid].gross:Infinity;
        if(s.gross<cur)bestG[s.jid]=s;
      });
      const gSorted=Object.values(bestG).sort((a,b)=>a.gross-b.gross);
      topGrossJids=new Set(gSorted.slice(0,3).map(s=>s.jid));
    }
  }

  const isNeto=tipo==="neto";
  let h=`<div style="overflow-x:auto"><table class="lb"><thead><tr>
    <th>Pos</th><th>Jugador</th>
    <th style="text-align:right">Gross</th>
    ${isNeto?`<th style="text-align:right">HCP</th><th style="text-align:right">Neto</th>`:""}
  </tr></thead><tbody>`;
  const MEDALS=["🥇","🥈","🥉"];
  let prizeIdx=0;
  sorted.forEach((s,i)=>{
    let rc="rn";
    let yaGanoGross=false;
    let prizeClass="";
    let medal="";
    if(!isNeto){
      if(i===0){rc="r1";prizeClass="prize-gross-1";medal=MEDALS[0];}
      else if(i===1){rc="r2";prizeClass="prize-gross-2";medal=MEDALS[1];}
      else if(i===2){rc="r3";prizeClass="prize-gross-3";medal=MEDALS[2];}
    }else{
      if(topGrossJids.has(s.jid)){
        yaGanoGross=true;
      }else{
        if(prizeIdx===0){rc="r1";prizeClass="prize-neto-1";medal=MEDALS[0];}
        else if(prizeIdx===1){rc="r2";prizeClass="prize-neto-2";medal=MEDALS[1];}
        else if(prizeIdx===2){rc="r3";prizeClass="prize-neto-3";medal=MEDALS[2];}
        prizeIdx++;
      }
    }
    const grossHi=!isNeto?'style="text-align:right;font-weight:600;color:var(--gd)"':'style="text-align:right"';
    const badge=yaGanoGross?` <span class="gross-badge" title="Ya premiado en Gross">🏆 Gross</span>`:"";
    const medalSpan=medal?` <span style="font-size:16px">${medal}</span>`:"";
    h+=`<tr class="clickable${yaGanoGross?" already-gross":""}${prizeClass?" "+prizeClass:""}" onclick="verTarjeta('${s.id}')" title="Ver tarjeta del día">
      <td><span class="rank ${rc}">${i+1}</span></td>
      <td><span class="pname">${s.nombre}</span>${medalSpan}${badge}</td>
      <td ${grossHi}>${s.gross}</td>
      ${isNeto?`<td style="text-align:right">${s.hcp>0?s.hcp:"—"}</td><td style="text-align:right"><span class="neto-v">${s.neto}</span></td>`:""}
      </tr>`;
  });
  h+=`</tbody></table></div>`;
  return h;
}

function renderLeaderboard(){
  const el=document.getElementById("tab-leaderboard");
  const LB_CATS=[...SCORE_CATS,"INICIALES"];
  // Torneos disponibles
  const torneos=["TODOS",...new Set(scores.map(s=>s.torneo).filter(Boolean))].sort((a,b)=>a==="TODOS"?-1:b==="TODOS"?1:b.localeCompare(a));
  const torneoSel=`<div style="margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <label style="font-size:13px;font-weight:500;color:var(--tm)">Torneo:</label>
    <select style="font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--cream-d);background:var(--white)" onchange="filterLbTorneo(this.value)">
      ${torneos.map(t=>`<option value="${t}" ${t===activeLbTorneo?"selected":""}>${t==="TODOS"?"Todos los torneos":t}</option>`).join("")}
    </select></div>`;
  const filters=`<div class="cat-filters">${["TODAS",...LB_CATS].map(c=>
    `<button class="cfbtn${c===activeLbCat?" active":""}" onclick="filterLb('${c}')">${
      c==="TODAS"?"Todas":c==="M18"?"Menores 18":CAT_LABEL[c]}</button>`
  ).join("")}</div>`;
  const cats=activeLbCat==="TODAS"?LB_CATS:[activeLbCat];
  // Scores filtrados por torneo
  const scoresFiltered=activeLbTorneo==="TODOS"?scores:scores.filter(s=>s.torneo===activeLbTorneo);
  let html="";

  cats.forEach(cat=>{
    // Categoría INICIALES y PRINCIPIANTES: listado de participaciones (sin Gross/Neto)
    if(cat==="INICIALES"||cat==="PRINCIPIANTES"){
      const inScores=scoresFiltered.filter(s=>s.cat===cat);
      if(!inScores.length)return;
      // Agrupar por jugador, contar participaciones
      const byJid={};
      inScores.forEach(s=>{
        if(!byJid[s.jid])byJid[s.jid]={s,count:0};
        byJid[s.jid].count++;
      });
      const participantes=Object.values(byJid).sort((a,b)=>a.s.nombre.localeCompare(b.s.nombre,"es"));
      let block=`<div class="lb-wrap"><div class="lb-cat-hdr">
        <span class="lb-cat-icon">${CAT_ICONS[cat]}</span>
        <span class="lb-cat-name">${CAT_LABEL[cat]}</span>
        <span class="lb-cat-years">${CAT_YEARS[cat]}</span></div>
        <div class="lb-block"><div class="lb-subhdr">
          <span>Participaciones</span>
          <span class="score-type">${participantes.length} ${participantes.length===1?"alumno":"alumnos"}</span></div>
        <div style="overflow-x:auto"><table class="lb"><thead><tr>
          <th style="width:50px">#</th><th>Jugador</th>
          <th style="text-align:right">Participaciones</th>
        </tr></thead><tbody>
        ${participantes.map((p,i)=>`<tr>
          <td><span class="rank rn">${i+1}</span></td>
          <td><span class="pname">${p.s.nombre}</span></td>
          <td style="text-align:right">${p.count}</td></tr>`).join("")}
        </tbody></table></div></div></div>`;
      html+=block;
      return;
    }

    const catScores=scoresFiltered.filter(s=>s.cat===cat&&!s.participacion);
    if(!catScores.length)return;
    const isMixed=MIXED_CATS.includes(cat);
    const isNetoMixed=NETO_ONLY_MIXED.includes(cat);

    // Encabezado de categoría
    let block=`<div class="lb-wrap"><div class="lb-cat-hdr">
      <span class="lb-cat-icon">${CAT_ICONS[cat]}</span>
      <span class="lb-cat-name">${CAT_LABEL[cat]}</span>
      <span class="lb-cat-years">${CAT_YEARS[cat]}</span></div>`;

    if(isMixed){
      // Gross mixto + Neto mixto (sin separar género)
      [["gross","Gross"],["neto","Neto"]].forEach(([t,lbl])=>{
        block+=`<div class="lb-block"><div class="lb-subhdr">
          <span>Clasificación general</span>
          <span class="score-type ${t}">${lbl}</span></div>${lbTable(catScores,t)}</div>`;
      });
    }else if(isNetoMixed){
      // Calcular top-3 gross por género para excluirlos del podio Neto
      const grossWinnersJids=new Set();
      ["F","M"].forEach(gen=>{
        const gScores=catScores.filter(s=>scoreGenero(s)===gen);
        const bestG={};
        gScores.forEach(s=>{const cur=bestG[s.jid]?bestG[s.jid].gross:Infinity;if(s.gross<cur)bestG[s.jid]=s;});
        Object.values(bestG).sort((a,b)=>a.gross-b.gross).slice(0,3).forEach(s=>grossWinnersJids.add(s.jid));
      });
      // Gross por género (Damas / Caballeros) + Neto mixto
      [["F","Damas"],["M","Caballeros"]].forEach(([gen,genLbl])=>{
        const gScores=catScores.filter(s=>scoreGenero(s)===gen);
        if(!gScores.length)return;
        block+=`<div class="lb-block"><div class="lb-subhdr">
          <span>${GEN_ICON[gen]} ${genLbl}</span>
          <span class="score-type gross">Gross</span></div>${lbTable(gScores,"gross")}</div>`;
      });
      block+=`<div class="lb-block"><div class="lb-subhdr">
        <span>Clasificación general</span>
        <span class="score-type neto">Neto</span></div>${lbTable(catScores,"neto",grossWinnersJids)}</div>`;
    }else{
      // Por género × (gross, neto) = hasta 4 tablas
      [["F","Damas"],["M","Caballeros"]].forEach(([gen,genLbl])=>{
        const gScores=catScores.filter(s=>scoreGenero(s)===gen);
        if(!gScores.length)return;
        [["gross","Gross"],["neto","Neto"]].forEach(([t,lbl])=>{
          block+=`<div class="lb-block"><div class="lb-subhdr">
            <span>${GEN_ICON[gen]} ${genLbl}</span>
            <span class="score-type ${t}">${lbl}</span></div>${lbTable(gScores,t)}</div>`;
        });
      });
    }
    block+=`</div>`;
    html+=block;
  });

  el.innerHTML=`${torneoSel}${filters}${html||'<div class="empty-st"><span class="empty-icon">⛳</span>No hay scores aún</div>'}`;
}

window.verTarjeta=id=>{
  const s=scores.find(x=>x.id===id);
  if(!s||!s.holes||!s.holes.length){showToast("Sin detalle de hoyos","err");return;}
  const n=s.holes.length;
  const gen=scoreGenero(s);
  const isVuelta=s.vuelta===true;

  // Obtener par y yardas según categoría y recorrido
  function getParArr(cat,vuelta,len){
    if(vuelta) return HOLE_PAR_VUELTA.slice(0,len);
    return (HOLE_PAR_CAT_IDA[cat]||HOLE_PAR_IDA).slice(0,len);
  }
  function getYdsArr(cat,vuelta,len){
    if(vuelta||!HOLE_YDS[cat])return null;
    return HOLE_YDS[cat].slice(0,len);
  }

  function bloque(holes,startHole,label,parArr,ydsArr){
    const hn=holes.length;
    const cols=hn+2;
    const gs=`display:grid;grid-template-columns:56px repeat(${hn},1fr) 44px;gap:3px;margin-bottom:3px;font-size:12px`;
    const lbl=label?`<div style="font-size:11px;font-weight:600;color:var(--tl);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 5px">${label}</div>`:"";
    let h=lbl+`<div style="${gs}">`;
    // Fila hoyo
    h+=`<div class="sc-cell hd">Hoyo</div>`;
    for(let i=0;i<hn;i++)h+=`<div class="sc-cell hd">${startHole+i}</div>`;
    h+=`<div class="sc-cell tot">TOT</div>`;
    // Fila par
    if(parArr){
      const pt=parArr.reduce((a,b)=>a+b,0);
      h+=`<div class="sc-cell par-lbl">Par</div>`;
      for(let i=0;i<hn;i++)h+=`<div class="sc-cell par-val">${parArr[i]??'—'}</div>`;
      h+=`<div class="sc-cell par-lbl">${pt}</div>`;
    }
    // Fila yardas
    if(ydsArr){
      const yt=ydsArr.reduce((a,b)=>a+b,0);
      h+=`<div class="sc-cell yds-lbl">Yds</div>`;
      for(let i=0;i<hn;i++)h+=`<div class="sc-cell yds-val">${ydsArr[i]??'—'}</div>`;
      h+=`<div class="sc-cell yds-lbl">${yt}</div>`;
    }
    // Fila score (con color relativo al par)
    const subtot=holes.reduce((a,b)=>a+b,0);
    h+=`<div class="sc-cell hd">Score</div>`;
    for(let i=0;i<hn;i++){
      const diff=parArr&&parArr[i]!=null?holes[i]-parArr[i]:null;
      let cls="sc-cell";
      if(diff!==null){if(diff<=-2)cls+=" sc-eagle";else if(diff===-1)cls+=" sc-birdie";else if(diff===0)cls+=" sc-par";else if(diff===1)cls+=" sc-bogey";else cls+=" sc-dbogey";}
      h+=`<div class="${cls}">${holes[i]}</div>`;
    }
    h+=`<div class="sc-cell tot">${subtot}</div></div>`;
    return h;
  }

  let body="";
  if(n===18){
    const front=s.holes.slice(0,9),back=s.holes.slice(9);
    const fPar=getParArr(s.cat,false,9),fYds=getYdsArr(s.cat,false,9);
    body=bloque(front,1,"Front 9 — hoyos 1 al 9",fPar,fYds)
        +bloque(back,10,"Back 9 — hoyos 10 al 18",null,null);
  }else{
    const startH=isVuelta?10:1;
    const label=n===9?(isVuelta?"Vuelta — hoyos 10 al 18":"Ida — hoyos 1 al 9"):`Hoyos 1 al ${n}`;
    const parArr=getParArr(s.cat,isVuelta,n);
    const ydsArr=getYdsArr(s.cat,isVuelta,n);
    body=bloque(s.holes,startH,label,parArr,ydsArr);
  }
  document.getElementById("modal-box").className="modal-box scorecard";
  document.getElementById("modal-box").innerHTML=`
    <div class="sc-head">
      <div class="sc-name">${s.nombre}</div>
      <div class="sc-meta">
        <span class="cat-pill c${s.cat}">${CAT_LABEL[s.cat]||s.cat}</span>
        <span class="gen-pill gen-${gen}">${GEN_LABEL[gen]}</span>
        · ${s.torneo} · ${s.fecha}
      </div>
    </div>
    ${body}
    <div class="sc-totals">
      <div class="sc-tot-item"><div class="l">Gross</div><div class="v">${s.gross}</div></div>
      <div class="sc-tot-item"><div class="l">Handicap</div><div class="v">${s.hcp>0?s.hcp:"—"}</div></div>
      <div class="sc-tot-item"><div class="l">Neto</div><div class="v">${s.neto}</div></div>
    </div>
    <div class="modal-acts">
      <button class="btn" onclick="closeModal()">Cerrar</button>
    </div>`;
  document.getElementById("modal-ov").style.display="flex";
};

function applyCategory(cat){
  isIniciales=(cat==="INICIALES"||cat==="PRINCIPIANTES");
  // Populate hole options
  const hm=document.getElementById("c-holemode");
  if(hm&&CAT_HOLE_OPTS[cat]){
    hm.innerHTML=CAT_HOLE_OPTS[cat].map(v=>`<option value="${v}">${v} hoyos</option>`).join("");
  }
  // Set defaults
  catHoles=CAT_DEF_HOLES[cat]||9;
  catVuelta=CAT_DEF_VUELTA[cat]||false;
  isM18=(catHoles===18);
  if(hm)hm.value=catHoles;
  const vueltaSel=document.getElementById("c-vuelta");
  if(vueltaSel)vueltaSel.value=catVuelta?"vuelta":"ida";
  const showVuelta=CATS_VUELTA.includes(cat)&&catHoles===9;
  const vg=document.getElementById("c-vuelta-g");
  if(vg)vg.style.display=showVuelta?"block":"none";
  document.getElementById("c-part-banner").style.display=isIniciales?"block":"none";
  document.getElementById("c-hcp-row").style.display="grid";
  document.getElementById("c-holemode-row").style.display=isIniciales?"none":"grid";
  document.getElementById("c-scores-card").style.display=isIniciales?"none":"block";
  document.getElementById("c-btn-save").textContent=isIniciales?"Registrar Participación":"Guardar Score";
  if(!isIniciales){
    document.getElementById("c-hcp18-g").style.display=(catHoles===18)?"block":"none";
    document.getElementById("c-scores-title").textContent=`Scores por hoyo (${catHoles} hoyos)`;
    buildHoles(catHoles);calcTotals();
  }
}

function buildHoles(n){
  const cat=document.getElementById("c-cat")?document.getElementById("c-cat").value:"";
  const yds=HOLE_YDS[cat]||null;
  const parIdaArr=HOLE_PAR_CAT_IDA[cat]||HOLE_PAR_IDA;
  const c=document.getElementById("c-holes");c.innerHTML="";
  const cls=n===18?"hg18":(n<=6)?"hg5":"hg9";
  const g=document.createElement("div");g.className=`holes-grid ${cls}`;
  function addHole(num,parIdx,useVuelta){
    const d=document.createElement("div");d.className="hole-inp";
    const parArr=useVuelta?HOLE_PAR_VUELTA:parIdaArr;
    const par=(parIdx!==null&&parArr[parIdx]!==undefined)?parArr[parIdx]:null;
    const y=(parIdx!==null&&yds&&parIdx<yds.length)?yds[parIdx]:null;
    d.innerHTML=`<label>H${num}</label>`
      +(par!==null?`<span class="hole-par">P${par}</span>`:"")
      +(y!==null?`<span class="hole-yds">${y}y</span>`:"")
      +`<input type="number" id="h${num}" min="1" max="10" oninput="calcTotals()" placeholder="—">`;
    g.appendChild(d);
  }
  if(n===18){
    const l=document.createElement("div");l.className="hole-group-lbl";l.textContent="Front 9 — hoyos 1 al 9";g.appendChild(l);
    for(let i=0;i<9;i++)addHole(i+1,i,false);
    const l2=document.createElement("div");l2.className="hole-group-lbl";l2.textContent="Back 9 — hoyos 10 al 18";g.appendChild(l2);
    for(let i=0;i<9;i++)addHole(i+10,i,true);
  }else if(catVuelta){
    const l=document.createElement("div");l.className="hole-group-lbl";l.textContent="Vuelta — hoyos 10 al 18";g.appendChild(l);
    for(let i=0;i<n;i++)addHole(i+10,i,true);
  }else{
    if(n===9){const l=document.createElement("div");l.className="hole-group-lbl";l.textContent="Ida — hoyos 1 al 9";g.appendChild(l);}
    for(let i=0;i<n;i++)addHole(i+1,i,false);
  }
  c.appendChild(g);
  document.getElementById("c-tot3").style.display=(n!==18)?"grid":"none";
  document.getElementById("c-tot5").style.display=n===18?"grid":"none";
}

window.calcTotals=()=>{
  const n=catHoles;
  let fr=0,bk=0,okF=true,okB=true;
  if(n===18){
    for(let i=1;i<=9;i++){const v=parseInt((document.getElementById("h"+i)||{}).value);if(isNaN(v))okF=false;else fr+=v;}
    for(let i=10;i<=18;i++){const v=parseInt((document.getElementById("h"+i)||{}).value);if(isNaN(v))okB=false;else bk+=v;}
  }else if(catVuelta){
    for(let i=10;i<10+n;i++){const v=parseInt((document.getElementById("h"+i)||{}).value);if(isNaN(v))okF=false;else fr+=v;}
  }else{
    for(let i=1;i<=n;i++){const v=parseInt((document.getElementById("h"+i)||{}).value);if(isNaN(v))okF=false;else fr+=v;}
  }
  const ok=n===18?(okF&&okB):okF,gross=fr+(n===18?bk:0);
  if(n!==18){const hcp=parseInt(document.getElementById("c-hcp").value)||0;
    document.getElementById("t-g").textContent=okF?gross:"—";
    document.getElementById("t-h").textContent=hcp||"—";
    document.getElementById("t-n").textContent=okF?(gross-hcp):"—";
  }else{const hcp=parseInt(document.getElementById("c-hcp18").value)||0;
    document.getElementById("t-f").textContent=okF?fr:"—";
    document.getElementById("t-b").textContent=okB?bk:"—";
    document.getElementById("t-g18").textContent=ok?gross:"—";
    document.getElementById("t-h18").textContent=hcp||"—";
    document.getElementById("t-n18").textContent=ok?(gross-hcp):"—";
  }
};

window.guardarScore=async()=>{
  const pid=document.getElementById("c-jug").value;
  const fecha=document.getElementById("c-fecha").value;
  const torneo=document.getElementById("c-torneo").value.trim();
  if(!pid){showToast("Seleccioná un jugador","err");return;}
  if(!fecha){showToast("Ingresá la fecha","err");return;}
  if(fecha)localStorage.setItem("rcgc_last_fecha",fecha);
  if(torneo)localStorage.setItem("rcgc_last_torneo",torneo);
  const p=players.find(x=>x.id===pid);
  const cat=document.getElementById("c-cat")?document.getElementById("c-cat").value:catFromYear(p.anio);
  const nombre=`${p.apellido}, ${p.nombre}`;
  const genero=p.genero==="F"?"F":"M";
  const btn=document.getElementById("c-btn-save");
  btn.disabled=true;btn.textContent="Guardando...";
  try{
    if(isIniciales){
      await addDoc(collection(db,"scores"),{jid:pid,nombre,genero,cat,fecha,torneo:torneo||"Sin nombre",participacion:true,holes:[],gross:0,hcp:0,neto:0,createdAt:serverTimestamp()});
      showToast("Participación registrada!");
    }else{
      const n=catHoles;const holes=[];
      const startH=n===18?1:(catVuelta?10:1);
      const endH  =n===18?18:(catVuelta?10+n-1:n);
      for(let i=startH;i<=endH;i++){const el=document.getElementById("h"+i);const v=parseInt(el?el.value:"");if(isNaN(v)||v<1){showToast("Completá todos los hoyos","err");btn.disabled=false;btn.textContent="Guardar Score";return;}holes.push(v);}
      const hcp=parseInt(document.getElementById(n===18?"c-hcp18":"c-hcp").value)||0;
      const gross=holes.reduce((a,b)=>a+b,0);
      await addDoc(collection(db,"scores"),{jid:pid,nombre,genero,cat,fecha,torneo:torneo||"Sin nombre",holes,gross,hcp,neto:gross-hcp,vuelta:catVuelta,participacion:false,createdAt:serverTimestamp()});
      showToast("Score guardado!");
    }
    clearCargar();
  }catch(e){showToast("Error: "+e.message,"err");}
  btn.disabled=false;btn.textContent=isIniciales?"Registrar Participación":"Guardar Score";
};

let histFilters={torneo:"",jugador:"",cat:"",genero:"",fecha:""};

function renderHistorial(){
  const el=document.getElementById("tab-historial");
  // Incluye TODO: scores con resultado y participaciones de Iniciales (sin score)
  const all=scores.slice();
  if(!all.length){el.innerHTML='<div class="empty-st"><span class="empty-icon">📋</span>El historial está vacío.</div>';return;}

  // Opciones únicas para los selects
  const torneos=[...new Set(all.map(s=>s.torneo))].sort();
  const jugadores=[...new Set(all.map(s=>s.nombre))].sort();
  const cats=[...new Set(all.map(s=>s.cat))];

  // Aplicar filtros
  let ss=all.filter(s=>{
    if(histFilters.torneo && s.torneo!==histFilters.torneo)return false;
    if(histFilters.jugador && s.nombre!==histFilters.jugador)return false;
    if(histFilters.cat && s.cat!==histFilters.cat)return false;
    if(histFilters.genero && scoreGenero(s)!==histFilters.genero)return false;
    if(histFilters.fecha && s.fecha!==histFilters.fecha)return false;
    return true;
  });

  const filtersHtml=`<div class="card"><div class="hist-filters">
    <div class="fg"><label>Torneo</label><select onchange="setHistFilter('torneo',this.value)">
      <option value="">Todos</option>${torneos.map(t=>`<option value="${t}" ${histFilters.torneo===t?"selected":""}>${t}</option>`).join("")}
    </select></div>
    <div class="fg"><label>Jugador</label><select onchange="setHistFilter('jugador',this.value)">
      <option value="">Todos</option>${jugadores.map(j=>`<option value="${j}" ${histFilters.jugador===j?"selected":""}>${j}</option>`).join("")}
    </select></div>
    <div class="fg"><label>Categoría</label><select onchange="setHistFilter('cat',this.value)">
      <option value="">Todas</option>${cats.map(c=>`<option value="${c}" ${histFilters.cat===c?"selected":""}>${CAT_LABEL[c]||c}</option>`).join("")}
    </select></div>
    <div class="fg"><label>Género</label><select onchange="setHistFilter('genero',this.value)">
      <option value="">Todos</option>
      <option value="F" ${histFilters.genero==="F"?"selected":""}>Damas</option>
      <option value="M" ${histFilters.genero==="M"?"selected":""}>Caballeros</option>
    </select></div>
    <div class="fg"><label>Fecha</label><input type="date" value="${histFilters.fecha}" onchange="setHistFilter('fecha',this.value)"></div>
    <div class="filter-clear"><button class="btn btn-sm" onclick="clearHistFilters()">Limpiar filtros</button></div>
  </div></div>`;

  const rows=ss.map(s=>{
    const gen=scoreGenero(s);
    const esInicial=s.participacion;
    // Las participaciones de Iniciales no tienen score ni tarjeta
    const clickAttr=esInicial?"":`class="clickable" onclick="verTarjeta('${s.id}')" title="Ver tarjeta del día"`;
    return `<tr ${clickAttr}>
    <td>${s.fecha||"—"}</td><td>${s.torneo||"—"}</td>
    <td><span class="pname">${s.nombre}</span></td>
    <td><span class="cat-pill c${s.cat}">${CAT_LABEL[s.cat]||s.cat}</span></td>
    <td><span class="gen-pill gen-${gen}">${GEN_LABEL[gen]}</span></td>
    <td style="text-align:right">${esInicial?"—":s.gross}</td>
    <td style="text-align:right">${esInicial?"—":(s.hcp>0?s.hcp:"—")}</td>
    <td style="text-align:right">${esInicial?'<span style="color:var(--tl);font-size:12px">participó</span>':`<span class="neto-v">${s.neto}</span>`}</td>
    ${isAdmin?`<td style="white-space:nowrap"><button class="btn btn-sm" onclick="event.stopPropagation();editScore('${s.id}')" style="margin-right:4px">Editar</button><button class="btn btn-sm btn-danger" onclick="event.stopPropagation();delScore('${s.id}')">Borrar</button></td>`:"<td></td>"}
  </tr>`;}).join("");

  const tableHtml=`<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto">
    <table class="lb"><thead><tr>
      <th>Fecha</th><th>Torneo</th><th>Jugador</th><th>Cat</th><th>Género</th>
      <th style="text-align:right">Gross</th><th style="text-align:right">HCP</th>
      <th style="text-align:right">Neto</th><th></th>
    </tr></thead><tbody>${rows||'<tr><td colspan="9" style="text-align:center;padding:24px;color:var(--tl)">Sin resultados con esos filtros</td></tr>'}</tbody></table></div></div>`;

  el.innerHTML=`<p style="font-size:13px;color:var(--tl);margin-bottom:12px">${ss.length} resultado${ss.length===1?"":"s"} · tocá una fila para ver la tarjeta del día</p>`+filtersHtml+tableHtml;
}

window.guardarEditScore=async(id,esPartic,n)=>{

  const btn=document.querySelector("#modal-box .btn-primary");
  btn.disabled=true;btn.textContent="Guardando...";
  try{

    const vueltaEl=document.getElementById("e-vuelta");
    if(vueltaEl) updates.vuelta=(vueltaEl.value==="vuelta");

// ─── Estadísticas ─────────────────────────────────────
let statMode="jugador";       // jugador | torneo | categoria | genero
let statScore="neto";         // neto | gross
let statSel="";               // valor seleccionado en el filtro principal

function renderEstadisticas(){
  const el=document.getElementById("tab-estadisticas");
  const all=scores.filter(s=>!s.participacion&&s.holes&&s.holes.length);
  if(!all.length){el.innerHTML='<div class="stats-empty"><span class="empty-icon" style="font-size:36px;display:block;margin-bottom:12px">📊</span>Todavía no hay scores con detalle de hoyos para analizar.</div>';return;}

  // Opciones para el selector principal según el modo
  let opciones=[];
  if(statMode==="jugador")  opciones=[...new Set(all.map(s=>s.nombre))].sort();
  if(statMode==="torneo")   opciones=[...new Set(all.map(s=>s.torneo))].sort();
  if(statMode==="categoria")opciones=SCORE_CATS.filter(c=>all.some(s=>s.cat===c));
  if(statMode==="genero")   opciones=["F","M"];
  if(statSel===""&&opciones.length)statSel=opciones[0];

  // Filtrar scores según selección
  let sel=all.filter(s=>{
    if(statMode==="jugador")  return s.nombre===statSel;
    if(statMode==="torneo")   return s.torneo===statSel;
    if(statMode==="categoria")return s.cat===statSel;
    if(statMode==="genero")   return scoreGenero(s)===statSel;
    return true;
  });

  const labelSel=statMode==="categoria"?(CAT_LABEL[statSel]||statSel):statMode==="genero"?GEN_LABEL[statSel]:statSel;

  const controls=`
    <div class="stats-controls">
      <div class="fg"><label>Analizar por</label>
        <select onchange="setStatMode(this.value)">
          <option value="jugador" ${statMode==="jugador"?"selected":""}>Jugador</option>
          <option value="torneo" ${statMode==="torneo"?"selected":""}>Torneo</option>
          <option value="categoria" ${statMode==="categoria"?"selected":""}>Categoría</option>
          <option value="genero" ${statMode==="genero"?"selected":""}>Género</option>
        </select>
      </div>
      <div class="fg"><label>${statMode.charAt(0).toUpperCase()+statMode.slice(1)}</label>
        <select onchange="setStatSel(this.value)">
          ${opciones.map(o=>{const lbl=statMode==="categoria"?(CAT_LABEL[o]||o):statMode==="genero"?GEN_LABEL[o]:o;return `<option value="${o}" ${statSel===o?"selected":""}>${lbl}</option>`;}).join("")}
        </select>
      </div>
      <div class="fg"><label>Tipo de score</label>
        <select onchange="setStatScore(this.value)">
          <option value="neto" ${statScore==="neto"?"selected":""}>Neto</option>
          <option value="gross" ${statScore==="gross"?"selected":""}>Gross</option>
        </select>
      </div>
    </div>`;

  if(!sel.length){el.innerHTML=controls+'<div class="stats-empty">Sin datos para esta selección.</div>';return;}

  // Métricas generales
  const vals=sel.map(s=>statScore==="neto"?s.neto:s.gross);
  const rondas=sel.length;
  const prom=(vals.reduce((a,b)=>a+b,0)/rondas).toFixed(1);
  const mejor=Math.min(...vals);
  const peor=Math.max(...vals);
  const jugadoresUnicos=new Set(sel.map(s=>s.jid)).size;
  const torneosUnicos=new Set(sel.map(s=>s.torneo)).size;

  const statCards=`<div class="stat-cards">
    <div class="stat-card"><div class="sv">${rondas}</div><div class="sl">Rondas</div></div>
    <div class="stat-card"><div class="sv">${prom}</div><div class="sl">Promedio ${statScore}</div></div>
    <div class="stat-card"><div class="sv">${mejor}</div><div class="sl">Mejor ${statScore}</div></div>
    <div class="stat-card"><div class="sv">${peor}</div><div class="sl">Peor ${statScore}</div></div>
    ${statMode!=="jugador"?`<div class="stat-card"><div class="sv">${jugadoresUnicos}</div><div class="sl">Jugadores</div></div>`:""}
    ${statMode!=="torneo"?`<div class="stat-card"><div class="sv">${torneosUnicos}</div><div class="sl">Torneos</div></div>`:""}
  </div>`;

  // Estadísticas por hoyo (promedio de cada hoyo)
  // Detectar si los scores son de 9 o 18 — usar el máximo de hoyos presente
  const maxHoles=Math.max(...sel.map(s=>s.holes.length));
  const holeSum=new Array(maxHoles).fill(0);
  const holeCnt=new Array(maxHoles).fill(0);
  sel.forEach(s=>{s.holes.forEach((v,i)=>{holeSum[i]+=v;holeCnt[i]++;});});
  const holeAvg=holeSum.map((sum,i)=>holeCnt[i]?sum/holeCnt[i]:0);
  const minAvgIdx=holeAvg.indexOf(Math.min(...holeAvg.filter(v=>v>0)));
  const maxAvgIdx=holeAvg.indexOf(Math.max(...holeAvg));

  // Escala fija 1–10 → 0–110px de altura de barra
  const BAR_MAX_PX=180;
  let bars=`<div class="hole-bars">`;
  holeAvg.forEach((avg,i)=>{
    const hpx=avg>0?Math.max(3,Math.round(((avg-1)/9)*BAR_MAX_PX)):0;
    const color=i===minAvgIdx?"#2d8a4d":i===maxAvgIdx?"#c0392b":"var(--gm)";
    bars+=`<div class="hole-bar-col">
      <span class="hole-bar-val">${avg.toFixed(1)}</span>
      <div class="hole-bar" style="height:${hpx}px;background:${color}" title="Hoyo ${i+1}: promedio ${avg.toFixed(2)}"></div>
      <span class="hole-bar-lbl">${i+1}</span>
    </div>`;
  });
  bars+=`</div>`;

  const holeCard=`<div class="card">
    <h2>Promedio de score por hoyo</h2>
    <p style="font-size:12px;color:var(--tl);margin-bottom:8px">
      <span style="color:#2d8a4d;font-weight:600">■</span> mejor hoyo (H${minAvgIdx+1})
      &nbsp;<span style="color:#c0392b;font-weight:600">■</span> peor hoyo (H${maxAvgIdx+1})
    </p>
    ${bars}
  </div>`;

  // Ranking de rondas (las mejores)
  const ranked=[...sel].sort((a,b)=>(statScore==="neto"?a.neto-b.neto:a.gross-b.gross)).slice(0,10);
  let rankRows=ranked.map((s,i)=>`<tr class="clickable" onclick="verTarjeta('${s.id}')">
    <td>${i+1}</td><td><span class="pname">${s.nombre}</span></td>
    <td>${s.torneo}</td><td>${s.fecha}</td>
    <td style="text-align:right"><span class="neto-v">${statScore==="neto"?s.neto:s.gross}</span></td>
  </tr>`).join("");
  const rankCard=`<div class="card" style="padding:0;overflow:hidden">
    <div style="padding:16px 20px 0"><h2>Mejores rondas — ${labelSel} (${statScore})</h2></div>
    <div style="overflow-x:auto"><table class="lb"><thead><tr>
      <th>#</th><th>Jugador</th><th>Torneo</th><th>Fecha</th><th style="text-align:right">${statScore}</th>
    </tr></thead><tbody>${rankRows}</tbody></table></div></div>`;

  el.innerHTML=controls+statCards+holeCard+rankCard;
}
window.setStatMode=v=>{statMode=v;statSel="";renderEstadisticas();};
window.setStatSel=v=>{statSel=v;renderEstadisticas();};
window.setStatScore=v=>{statScore=v;renderEstadisticas();};

window.savePlayer=async()=>{
  const apellido=document.getElementById("m-ap").value.trim().toUpperCase();
  const nombre=document.getElementById("m-nom").value.trim();
  const fecha_nac=document.getElementById("m-fecha-nac").value;

    if(editingId){
      await setDoc(doc(db,"players",editingId),{apellido,nombre,anio,fecha_nac,genero},{merge:true});

      await addDoc(collection(db,"players"),{apellido,nombre,anio,fecha_nac,genero});

window.delPlayer=async id=>{
  const p=players.find(x=>x.id===id);

window.closeModal=()=>{document.getElementById("modal-ov").style.display="none";document.getElementById("modal-box").className="modal-box";};

// ─── Importar fechas de nacimiento desde base de alumnos ──
function normName(s){
  return (s||"").toString().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // quita tildes
    .replace(/\s+/g," ").trim();
}
function buildImportPlan(){
  const matched=[], noDate=[], noMatch=[];
  ALUMNOS_FECHAS.forEach(a=>{
    const an=normName(a.apellido), nn=normName(a.nombre);
    const p=players.find(p=>normName(p.apellido)===an && normName(p.nombre)===nn);
    if(!p){noMatch.push(a);return;}
    if(!a.fecha_nac){noDate.push({a,p});return;}
    matched.push({a,p,willUpdate: !!a.fecha_nac && a.fecha_nac!==(p.fecha_nac||"")});
  });
  return {matched,noDate,noMatch};
}
window.openImportFechas=()=>{
  if(!isAdmin)return;
  const {matched,noDate,noMatch}=buildImportPlan();
  const toUpdate=matched.filter(m=>m.willUpdate);
  const already=matched.filter(m=>!m.willUpdate);
  document.getElementById("modal-box").className="modal-box modal-box-wide";
  document.getElementById("modal-box").innerHTML=`
    <h3>Importar fechas de nacimiento</h3>
    <p style="font-size:13px;color:var(--tl)">Se cruza la base de alumnos (${ALUMNOS_FECHAS.length} registros) con los ${players.length} jugadores cargados, por apellido y nombre.</p>
    <div class="imp-summary">
      <div><b>${toUpdate.length}</b>Para actualizar</div>
      <div><b>${already.length}</b>Ya correctas</div>
      <div><b>${noDate.length}</b>Sin fecha en la base</div>
      <div><b>${noMatch.length}</b>Sin coincidencia</div>
    </div>
    ${toUpdate.length?`<table class="imp-table"><thead><tr><th>Jugador</th><th>Fecha actual</th><th>Fecha correcta</th></tr></thead>
      <tbody>${toUpdate.map(m=>`<tr><td>${m.p.apellido}, ${m.p.nombre}</td><td class="imp-skip">${m.p.fecha_nac||"—"}</td><td class="imp-ok">${m.a.fecha_nac}</td></tr>`).join("")}</tbody></table>`:""}
    ${noMatch.length?`<details style="margin-top:10px"><summary>Alumnos sin coincidencia (${noMatch.length})</summary>
      <table class="imp-table"><tbody>${noMatch.map(a=>`<tr><td class="imp-skip">${a.apellido}, ${a.nombre}</td><td class="imp-skip">${a.genero||""} ${a.fecha_nac||"(sin fecha)"}</td></tr>`).join("")}</tbody></table></details>`:""}
    ${noDate.length?`<details style="margin-top:10px"><summary>Alumnos sin fecha en la base (${noDate.length})</summary>
      <table class="imp-table"><tbody>${noDate.map(({a,p})=>`<tr><td class="imp-skip">${p.apellido}, ${p.nombre}</td></tr>`).join("")}</tbody></table></details>`:""}
    <div class="modal-acts">
      <button class="btn" onclick="closeModal()">Cerrar</button>
      ${toUpdate.length?`<button class="btn btn-primary" onclick="applyImportFechas()">Aplicar ${toUpdate.length} cambios</button>`:""}
    </div>`;
  document.getElementById("modal-ov").style.display="flex";
};
window.applyImportFechas=async()=>{
  const {matched}=buildImportPlan();
  const toUpdate=matched.filter(m=>m.willUpdate);
  if(!toUpdate.length){closeModal();return;}
  if(!confirm(`¿Confirmás cargar la fecha de nacimiento para ${toUpdate.length} jugadores?`))return;
  let ok=0,err=0;
  for(const m of toUpdate){
    try{
      const anio=parseInt(m.a.fecha_nac.split("-")[0]);
      await setDoc(doc(db,"players",m.p.id),{fecha_nac:m.a.fecha_nac,anio},{merge:true});
      ok++;
    }catch(e){err++;}
  }
  closeModal();
  showToast(err?`Listo: ${ok} actualizados, ${err} con error`:`¡${ok} jugadores actualizados!`);
};

      <table class="imp-table"><thead><tr><th></th><th>Jugador</th><th>Fecha actual</th><th>Fecha nueva</th></tr></thead>

    <div class="modal-acts">

window.applyUpdateMayo2026=async()=>{
  const corr=window._mayoCorr||[], nuevos=window._mayoNuevos||[];
  const corrSel=corr.filter((x,i)=>document.getElementById(`corr-${i}`)?.checked);
  const nuevosSel=nuevos.map((n,i)=>({n,gen:document.getElementById(`gen-${i}`)?.value})).filter((x,i)=>document.getElementById(`nuevo-${i}`)?.checked);
  if(!corrSel.length && !nuevosSel.length){closeModal();return;}
  if(!confirm(`¿Confirmás aplicar ${corrSel.length} corrección(es) de fecha y crear ${nuevosSel.length} jugador(es) nuevo(s)?`))return;
  let ok=0,err=0;
  for(const x of corrSel){
    try{
      const anio=parseInt(x.c.fecha_nueva.split("-")[0]);
      await setDoc(doc(db,"players",x.p.id),{fecha_nac:x.c.fecha_nueva,anio},{merge:true});
      ok++;
    }catch(e){err++;}
  }
  for(const x of nuevosSel){
    try{
      const anio=x.n.fecha_nac?parseInt(x.n.fecha_nac.split("-")[0]):null;
      await addDoc(collection(db,"players"),{apellido:x.n.apellido,nombre:x.n.nombre,genero:x.gen||"M",fecha_nac:x.n.fecha_nac||"",anio});
      ok++;
    }catch(e){err++;}
  }
  closeModal();
  showToast(err?`Listo: ${ok} cambios aplicados, ${err} con error`:`¡${ok} cambios aplicados correctamente!`);
};

window.exportData=()=>{
  const data={version:2,exportDate:new Date().toISOString(),players,scores};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;
  a.download=`rcgc-respaldo-${new Date().toISOString().split("T")[0]}.json`;
  a.click();URL.revokeObjectURL(url);showToast("Respaldo exportado!");
};
window.importData=async e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.players||!data.scores){showToast("Archivo inválido","err");return;}
      if(!confirm(`¿Importar ${data.players.length} jugadores y ${data.scores.length} scores?`))return;
      showToast("Importando...");
      for(const p of data.players)await addDoc(collection(db,"players"),p);
      for(const s of data.scores){const{id,...rest}=s;await addDoc(collection(db,"scores"),{...rest,createdAt:serverTimestamp()});}
      showToast("Datos importados!");
    }catch(err){showToast("Error: "+err.message,"err");}
  };
  reader.readAsText(file);e.target.value="";
};
window.clearScoresOnly=async()=>{
  if(!confirm("¿Borrar TODOS los scores?"))return;
  if(!confirm("Segunda confirmación: ¿seguro?"))return;
  const snap=await getDocs(collection(db,"scores"));
  for(const d of snap.docs)await deleteDoc(d.ref);
  showToast("Scores eliminados.");
};

    ["BEAMONTE","Ramon",2019,"M"],["BELGOFF","Ines",2020,"F"],
    ["BERTAINA","Clara",2021,"F"],["BERTAINA","Lucia",2015,"F"],
    ["BERTOLDI","Lola",2020,"F"],["BERTOLDI","Vicente",2021,"M"],
    ["BOCCO","Isabella",2014,"F"],["BUSTAMANTE","Lara",2015,"F"],
    ["BUSTAMANTE","Maria",2017,"F"],["BUSTAMANTE","Paula",2013,"F"],
    ["CARBONETTI","Martina",2013,"F"],["CAROL","Juan Cruz",2014,"M"],
    ["CARRANZA JORBA","Alfonso",2015,"M"],["CARRANZA","Agustin",2009,"M"],
    ["CARRANZA","Clodomiro",2011,"M"],["CARRANZA","Francisco",2019,"M"],
    ["CARRANZA","Guada",2020,"F"],["CARRANZA","Ignacio",2014,"M"],
    ["CARRANZA","Joaquin",2017,"M"],["CARRANZA","Magui",2020,"F"],

    ["MAGRI","Justina",2017,"F"],["MAGRI","Trinidad",2014,"F"],
    ["MANA","Gio",2013,"M"],["MARTORELI","Faustino",2020,"M"],
    ["MEDINA CABRAL","Pedro",2017,"M"],["OTONELLI","Ema",2019,"F"],

}
